_format_version: "2.1"
_transform: true

services:
  # PostgREST API
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Language
            - Content-Type
            - Authorization
            - apikey
            - x-client-info
          exposed_headers:
            - Content-Range
          credentials: true

  # GoTrue Auth
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Language
            - Content-Type
            - Authorization
            - apikey
            - x-client-info
          credentials: true

  # Storage API
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Language
            - Content-Type
            - Authorization
            - apikey
            - x-client-info
            - range
          exposed_headers:
            - Content-Range
          credentials: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY:-your-anon-key}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY:-your-service-role-key}
