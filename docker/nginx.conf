server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ===========================================
    # SERVER FINGERPRINT REMOVAL
    # ===========================================
    
    # Hide server version information
    server_tokens off;
    
    # Remove Server header completely (requires headers-more-nginx-module)
    # If module not available, server_tokens off still hides version
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';
    more_clear_headers 'X-AspNet-Version';
    more_clear_headers 'X-AspNetMvc-Version';
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ===========================================
    # SECURITY HEADERS - Enterprise Grade
    # ===========================================
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Content Security Policy (Hardened - removed unsafe-inline from script-src)
    # Note: unsafe-inline for style-src is required for Tailwind CSS dynamic styling
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http://kong:8000; connect-src 'self' http://kong:8000 ws://kong:8000; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none';" always;
    
    # Permissions Policy - Restrict browser features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # Prevent caching of sensitive pages (HTML only)
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # ===========================================
    # COOKIE SECURITY - SameSite Enforcement
    # ===========================================
    
    # Add SameSite=Strict to all cookies from backend
    proxy_cookie_flags ~ secure samesite=strict;

    # Cache static assets (override no-cache for assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===========================================
    # API PROXIES with Cookie Security
    # ===========================================

    # Auth API proxy
    location /auth/ {
        proxy_pass http://kong:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enforce SameSite on auth cookies
        proxy_cookie_flags ~ secure samesite=strict;
    }
    
    # REST API proxy
    location /rest/ {
        proxy_pass http://kong:8000/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Storage API proxy
    location /storage/ {
        proxy_pass http://kong:8000/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }
}
