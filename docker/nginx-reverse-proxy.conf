# HTTPS Reverse Proxy Configuration
# Place this on the company server (separate from the existing docker/nginx.conf which serves the SPA).
# Saves to: /etc/nginx/sites-available/talentos-api.conf
# Then symlink: ln -s /etc/nginx/sites-available/talentos-api.conf /etc/nginx/sites-enabled/
#
# Provides HTTPS termination + reverse proxy to local Docker Kong on port 8000.
# Use with Let's Encrypt (certbot) for free SSL.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hr.yourcompany.ge;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — TalentOS Backend API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hr.yourcompany.ge;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/hr.yourcompany.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.yourcompany.ge/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide server info
    server_tokens off;

    # CORS for the desktop Electron app (origin: file://)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info" always;

    # Body size limit (CV / file uploads)
    client_max_body_size 50M;

    # === Reverse Proxy to Kong (Docker) ===
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # WebSocket support (Realtime)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Timeouts (large reports / long queries)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Optional: rate limiting (uncomment to enable)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # limit_req zone=api burst=50 nodelay;
}
